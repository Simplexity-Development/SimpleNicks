plugins {
    id 'fabric-loom' version '1.10.+'
}

java {
    targetCompatibility = JavaVersion.VERSION_21
    sourceCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.5'
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

    implementation project(':core')

    include(modImplementation("net.kyori:adventure-platform-fabric:${adventureFabricVersion}"))
    include(modImplementation("net.kyori:adventure-text-minimessage:${miniMessageVersion}"))
    include(modImplementation("com.zaxxer:HikariCP:${hikariVersion}"))
    include(modImplementation("org.xerial:sqlite-jdbc:3.47.+"))
    include(implementation("org.yaml:snakeyaml:2.2"))

    // fabric-permissions-api: softdepend permissions with op-level fallback
    include(modImplementation("me.lucko:fabric-permissions-api:${fabricPermissionsVersion}"))
}
